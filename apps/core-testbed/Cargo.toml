[package]
name = "core-testbed"
description = "A small app that exercises every jcj- crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jcj-doc = { workspace = true }
jcj-layout = { workspace = true }
jcj-engine = { workspace = true }
jcj-output = { workspace = true }
jcj-interchange = { workspace = true }
jcj-proof = { workspace = true }
jcj-project = { workspace = true }
jcj-theme = { workspace = true }
jcj-board = { workspace = true }
jcj-entries = { workspace = true }
# With the window: the core's start-up opens it (`jcj_shell::desktop`).
jcj-shell = { workspace = true, features = ["window"] }
jcj-agents = { workspace = true }
jcj-features = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
