[package]
name = "app"
description = "A foundation app on open-source-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jcj-doc = { workspace = true }
jcj-layout = { workspace = true }
jcj-engine = { workspace = true }
jcj-output = { workspace = true }
jcj-project = { workspace = true }
jcj-features = { workspace = true }
# With the window: the core's start-up opens it (`jcj_shell::desktop`).
jcj-shell = { workspace = true, features = ["window"] }
serde_json = { workspace = true }

# Embeds the Windows icon and the program's name (build.rs); nothing for other targets.
[build-dependencies]
winresource = { workspace = true }

# What Windows shows for the program (Explorer, the taskbar): read by build.rs.
[package.metadata.winresource]
ProductName = "App"
FileDescription = "App"
CompanyName = "The app's maker"
LegalCopyright = "Copyright (c) the app's contributors. MIT OR Apache-2.0"
