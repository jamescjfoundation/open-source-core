# Weekly update proposals (decision 0001). Upstream crates are pinned on purpose and move only
# at the two-week train (docs/UPSTREAM.md), so they are left alone here.
# The actions pinned in shared-ci.yml and shared-core-pin.yml run in every app: an update to
# one reaches the apps when the tag `workflows-v1` is moved (.github/workflows/README.md).
# Apps carry their own file, for GitHub Actions only (template/.github/dependabot.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "wordcraft-*"
      - dependency-name: "craft-*"
      - dependency-name: "krilla"
      - dependency-name: "egui*"
      - dependency-name: "eframe"
      - dependency-name: "epaint*"
      - dependency-name: "emath"
      - dependency-name: "ecolor"
      - dependency-name: "winit"
      - dependency-name: "zip"
      # Shared with WordCraft at the versions it pins; they move with the train.
      - dependency-name: "quick-xml"
      - dependency-name: "image"
      - dependency-name: "serde*"
      - dependency-name: "chrono"
      - dependency-name: "sha2"
