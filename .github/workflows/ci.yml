# CI for open-source-core (decision 0003). This file only says when CI runs. The jobs are in
# shared-ci.yml, the workflow every app's CI calls too, taken here from the same commit: a change
# to it is tried on this repository's own pushes before the tag the apps call is moved to it
# (README.md in this folder).
#
# - checks: `cargo xtask ci` without clippy and tests, on every push to main and every pull
#   request, a change to Markdown alone included.
# - cargo-deny.
# - build: clippy and tests (cargo-nextest) for what changed since the last commit that passed
#   CI on main, and for everything that depends on it.
#
# A newer push cancels an older run. The full matrix (Linux, macOS, Windows), the minimum Rust
# version and the full test run are in nightly.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run every test, not only what changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The shared workflow's jobs get this token and no more: read the code, and read the list of
    # workflow runs to find the last one that passed.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/shared-ci.yml
    with:
      full: ${{ inputs.full == true }}
      nextest: true
