# The gate on GitHub, written once: this repository's own `ci.yml` calls this file, and so does
# the `ci.yml` of every app built on open-source-core (decision 0003). An app calls it at the tag
# `workflows-v1`, which is moved by hand to a commit of `main` whose own CI run passed, so a fix
# here reaches every app in one step, with no release of the crates and no change in an app
# (README.md in this folder says how the tag is moved, and when a `workflows-v2` is needed).
#
# What it may ask of the calling repository, and nothing more (the tag is used by apps on every
# core release from 0.1.19 on):
#
# - `cargo xtask ci --skip clippy,test`: every task of the gate that needs no product build;
# - `cargo xtask affected --base <commit>`: one line, `all`, package names, or empty;
# - `cargo xtask ci [--changed --base <commit>] --only clippy,test`;
# - `cargo deny --locked check` with the repository's `deny.toml`;
# - a `rust-toolchain.toml` and a `Cargo.lock` at the root.
#
# One thing it tries and does without: `cargo xtask prune-target <lock file>`, which an app has
# from core 0.1.21 on. An older app keeps a little stale build output until it moves.
#
# Built so nobody waits on it:
#
# - The gate is `cargo xtask ci`, the same command the pre-push hook runs, so CI confirms what
#   the developer already saw.
# - Three jobs in parallel. `checks` runs on every push and pull request, a change to Markdown
#   alone included: formatting, privacy, links and, in an app, that the shared files and marked
#   blocks match the pinned core release. A task an app adds to its gate runs here, once.
# - `build` runs clippy and the tests for what changed since the last commit that passed CI on
#   `main` (found through the GitHub API, so a cancelled run's changes are never skipped), and
#   for everything that depends on it. A changed file that a package's sources name (a design,
#   a font, a fixture, a golden file, a page a test compares) counts as that package's.
#   Manifests, the lock file or the toolchain changing means everything. When the change
#   affects no package the job ends before it restores any build output.
# - The tests run under cargo-nextest where the calling repository's gate uses it (an app's
#   does from core 0.1.21 on): every test program at once, not one after another.
# - cargo-nextest and cargo-deny are downloaded as the release files their projects publish,
#   and each file's checksum is checked against the one written below. Nothing is compiled to
#   get a tool.
#
# What is kept between runs (README.md in this folder, "What CI keeps between runs"):
#
# - `cargo-home-<lock file>`: the crates and git repositories Cargo downloaded.
# - `deps-<system>-<toolchain and settings>-<dependencies>`: the build output of the
#   dependencies, and only theirs. A package built from a folder (the workspace's own) is
#   built again on every run whatever is kept, because a fresh checkout is newer than any
#   output; keeping it only made the archive several times larger.
# - Both are saved from `main` only, and only when no archive with that exact name exists. A
#   push that moves no dependency saves nothing. No name holds a commit, so pushes do not pile
#   up archives.
# - On `main`, a run that finds no archive for its dependencies builds everything, so that what
#   it saves is whole.
#
# The `github` context here is the calling repository's: its code is checked out, its commit is
# tested, its token is used. That token is read-only; the caller grants `contents: read` and
# `actions: read` (to find the last run that passed) and this file asks for no more.
# Only GitHub's own actions, pinned to full commit SHAs (`cargo xtask workflows` checks it).
name: Shared CI

on:
  workflow_call:
    inputs:
      full:
        description: "Run clippy and every test, not only what changed"
        type: boolean
        default: false

permissions:
  contents: read

# A tool's version and the checksum of each file downloaded for it. Another workflow that
# downloads the same tool names the same values (`cargo xtask workflows` checks it). To move to
# a newer version: change the version, then each checksum, to the `sha256` the project's
# release page shows for the file (`gh release view <tag> --repo <project> --json assets`).
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "short"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_LINUX_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  CARGO_NEXTEST_VERSION: "0.9.152"
  CARGO_NEXTEST_LINUX_SHA256: "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a"

jobs:
  # Everything that needs no product build. About half a minute.
  checks:
    name: checks (every task but clippy and test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # privacy checks every commit identity
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Restore cargo home
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
      - name: cargo xtask ci (checks only)
        run: cargo xtask ci --skip clippy,test

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Restored, never saved here: without it every git dependency is cloned again on each run,
      # and a refused clone fails the job.
      - name: Restore cargo home
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
      - name: Install cargo-deny (the project's release file, checksum checked)
        run: |
          file="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 5 --output "$file" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$file"
          echo "$CARGO_DENY_LINUX_SHA256  $file" | sha256sum --check --strict -
          tar -xzf "$file" --strip-components=1 -C "$(dirname "$(command -v cargo)")" "${file%.tar.gz}/cargo-deny"
          cargo deny --version
      - name: cargo deny check
        run: cargo deny --locked check

  # Clippy and tests for the packages this change affects.
  build:
    name: clippy and tests (affected packages)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # to diff against the last green commit
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Restore cargo home
        id: home
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
      - name: Name the dependencies' build output
        id: name
        env:
          KIND: deps-${{ runner.os }}
        run: |
          # BEGIN same: name the build output
          # What decides the build output of the dependencies, and nothing else: the toolchain,
          # Cargo's settings, the locked packages that come from elsewhere (a package of the
          # workspace has no `source` line), and the manifests without the workspace's own
          # version. A change to the workspace's code, or a release that moves only its
          # version, keeps the archive it has.
          hash() { if command -v sha256sum >/dev/null; then sha256sum; else shasum -a 256; fi | cut -c1-32; }
          settings=$(cat rust-toolchain.toml .cargo/config.toml | hash)
          dependencies=$({
            awk -v RS= '/\nsource = /' Cargo.lock
            git ls-files -z -- '*Cargo.toml' ':(exclude)template/*' | xargs -0 grep -hv '^version = '
          } | hash)
          {
            echo "key=$KIND-$settings-$dependencies"
            echo "older=$KIND-$settings-"
          } >> "$GITHUB_OUTPUT"
          # END same: name the build output
      # Asks only whether the archive exists; nothing is downloaded yet.
      - name: Is build output kept for these dependencies?
        id: kept
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.name.outputs.key }}
          lookup-only: true
      - name: What to check
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ inputs.full }}
          KEPT: ${{ steps.kept.outputs.cache-hit }}
          # The calling workflow, as owner/repository/.github/workflows/<file>@<ref>.
          CALLER: ${{ github.workflow_ref }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$FULL" != "true" ]; then
            # The newest commit on main whose run of the calling workflow passed; everything
            # after it is checked.
            workflow="${CALLER%@*}"
            workflow="${workflow##*/}"
            if ! passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main \
                          --status success --limit 20 --json headSha --jq '.[].headSha'); then
              echo "::warning::could not list the runs of $workflow that passed: checking everything"
              passed=""
            fi
            for sha in $passed; do
              if git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then base="$sha"; break; fi
            done
          fi
          # What `main` saves is restored by every later run with these dependencies, so it
          # must be the output of a whole build: a run of two packages would leave the rest out
          # for good.
          if [ -n "$base" ] && [ "$KEPT" != "true" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "No build output is kept for these dependencies yet: checking everything, so that it can be saved whole"
            base=""
          fi
          if [ -z "$base" ]; then
            {
              echo "args="
              echo "build=true"
              echo "whole=true"
            } >> "$GITHUB_OUTPUT"
            echo "Checking everything"
            exit 0
          fi
          echo "Checking changes since $base"
          if ! affected=$(cargo xtask affected --base "$base"); then
            echo "::error::cargo xtask affected failed (see the log above). If the task is unknown, add it to xtask/src/main.rs as the core's CHANGELOG says for 0.1.19."
            exit 1
          fi
          echo "args=--changed --base $base" >> "$GITHUB_OUTPUT"
          if [ "$affected" = "all" ]; then
            echo "whole=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$affected" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Affected: $affected"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "The change affects no package: nothing to build or test"
          fi
      # The archive for these dependencies, or else the newest one for this toolchain: after a
      # dependency moves, most of the others are still as they were.
      - name: Restore the dependencies' build output
        id: deps
        if: steps.plan.outputs.build == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.name.outputs.key }}
          restore-keys: ${{ steps.name.outputs.older }}
      # Restored from another lock file: the output of every dependency that moved since, and of
      # everything built on one, will never be read again. Without this it would be saved again
      # with each new archive, for good.
      - name: Drop the output of dependencies that moved
        if: steps.plan.outputs.build == 'true' && steps.deps.outputs.cache-hit != 'true' && steps.deps.outputs.cache-matched-key != ''
        run: |
          if [ ! -f target/deps.lock ]; then
            echo "The restored output does not say which lock file it was built from: starting from nothing"
            rm -rf target
          elif ! cargo xtask prune-target target/deps.lock; then
            echo "::notice::Stale build output was not removed (the task is in an app's xtask from core 0.1.21 on). The build is right either way; the archive is larger than it need be."
          fi
      - name: Install cargo-nextest (the project's release file, checksum checked)
        if: steps.plan.outputs.build == 'true'
        run: |
          file="cargo-nextest-$CARGO_NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 5 --output "$file" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$CARGO_NEXTEST_VERSION/$file"
          echo "$CARGO_NEXTEST_LINUX_SHA256  $file" | sha256sum --check --strict -
          tar -xzf "$file" -C "$(dirname "$(command -v cargo)")"
          cargo nextest --version
      - name: cargo xtask ci (clippy and tests)
        if: steps.plan.outputs.build == 'true'
        env:
          ARGS: ${{ steps.plan.outputs.args }}
        run: |
          # $ARGS is empty or `--changed --base <commit>`: unquoted so that it is split into words.
          # shellcheck disable=SC2086
          cargo xtask ci $ARGS --only clippy,test
      # Saved from main only, after a whole build, and only when these dependencies have no
      # archive yet.
      - name: Keep the dependencies' build output, not the workspace's own
        id: trim
        if: steps.plan.outputs.whole == 'true' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        env:
          LOCK: Cargo.lock
        run: |
          # BEGIN same: keep the dependencies' output
          # Every package built from a folder (the workspace's own, a linked checkout) is
          # taken out, with the scratch folders of tests and tools: a fresh checkout is newer
          # than any output of theirs, so they are built again whatever is kept.
          cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.source == null) | "--package=\(.name)"' | tr -d '\r' \
            | xargs -r cargo clean --locked
          rm -rf target/tmp target/nextest target/xtask-sync target/template-check target/*/incremental target/*/examples
          cp "$LOCK" target/deps.lock
          du -sh target
          # END same: keep the dependencies' output
      - name: Save the dependencies' build output (main only)
        if: steps.trim.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true # a run that could not save is still a run that passed
        with:
          path: target
          key: ${{ steps.name.outputs.key }}
      - name: Save cargo home (main only)
        if: steps.plan.outputs.build == 'true' && github.ref == 'refs/heads/main' && steps.home.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.home.outputs.cache-primary-key }}
