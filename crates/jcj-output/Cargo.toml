[package]
name = "jcj-output"
description = "PDF, page images and printing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Printing through the system spooler (CUPS, Windows).
print = ["jcj-upstream/print"]

[dependencies]
jcj-upstream = { workspace = true, features = ["pdf-read"] }
jcj-doc = { workspace = true }
jcj-layout = { workspace = true }
kurbo = { workspace = true }

